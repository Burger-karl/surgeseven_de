{% extends 'base.html' %}
{% load static %}
{% block title %}404 Error{% endblock %}


{% block main-content %}
<div class="container">
    <h1>404: Page Not Found</h1>
    <p>The requested resource was not found on this server.</p>
    <p><strong>Requested Path:</strong> {{ request.path }}</p>
    <a href="/" class="btn btn-primary">Return Home</a>
</div>
{% endblock %}
