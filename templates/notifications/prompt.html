<!-- templates/notifications/prompt.html -->
<div id="notification-prompt" class="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Enable Notifications</h5>
            </div>
            <div class="modal-body">
                <p>Get real-time notifications even when you're not on our site.</p>
                <p>Would you like to enable push notifications?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="disable-notifications">Not Now</button>
                <button type="button" class="btn btn-primary" id="enable-notifications">Enable</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Only show prompt if notifications are supported
    if ('Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window) {
        // Check if user has already made a choice
        if (Notification.permission === 'default') {
            // Show modal prompt
            $('#notification-prompt').modal('show');
            
            // Handle enable button
            document.getElementById('enable-notifications').addEventListener('click', function() {
                Notification.requestPermission().then(function(permission) {
                    if (permission === 'granted') {
                        // Initialize push notifications
                        initPushNotifications();
                    }
                    $('#notification-prompt').modal('hide');
                });
            });
            
            // Handle disable button
            document.getElementById('disable-notifications').addEventListener('click', function() {
                localStorage.setItem('notificationPrompted', 'true');
                $('#notification-prompt').modal('hide');
            });
        }
    }
    
    function initPushNotifications() {
        // Your push notification initialization logic
    }
</script>
